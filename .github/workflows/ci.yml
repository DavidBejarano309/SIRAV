name: SIRAV CI
on:
  push:
  pull_request:
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Configurar entorno
        run: bash scripts/configure.sh
      - name: Iniciar bases reales
        run: docker compose -f compose.yaml -f compose.test.yaml up -d --wait postgres mongo
      - name: Compilar y ejecutar pruebas integrales
        env:
          SIRAV_INTEGRATION: "true"
          SEED_DEMO: "true"
          DEMO_PASSWORD: SiravDemo2026!
          JWT_SECRET: ci-test-secret-at-least-32-bytes-long
          DB_URL: jdbc:postgresql://localhost:55432/sirav_3fn
          DB_USER: sirav_app
        run: |
          set -a
          source .env
          set +a
          export MONGO_URI="mongodb://sirav_app:${MONGO_PASSWORD}@localhost:57017/sirav_3fn?authSource=sirav_3fn"
          mvn -B -f backend/pom.xml verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/target/surefire-reports
      - name: Detener servicios
        if: always()
        run: docker compose -f compose.yaml -f compose.test.yaml down
